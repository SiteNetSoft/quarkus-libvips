quarkus.http.test-port=0
# the system library unless QUARKUS_LIBVIPS_LIBRARY names another path or soname
quarkus.libvips.library=${QUARKUS_LIBVIPS_LIBRARY:libvips.so.42}
# small, so that the size refusal needs only a little more than a typical test image
quarkus.libvips.limits.max-input-size=64K
quarkus.http.limits.max-body-size=1M
