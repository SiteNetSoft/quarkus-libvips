name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Install libvips
        run: |
          sudo apt-get update
          # Ubuntu 24.04 renamed the package for the 64-bit time_t transition; the AV1 plugin is for AVIF saving
          sudo apt-get install -y libvips42t64 libheif-plugin-aomenc || sudo apt-get install -y libvips42 libheif-plugin-aomenc
          lib="$(ldconfig -p | awk '/libvips\.so\.42 / { print $NF; exit }')"
          [ -n "$lib" ] || { echo "::error::libvips.so.42 not found after install"; exit 1; }
          dpkg -l | awk '/libvips42|libheif/ { print $2, $3 }'
          echo "QUARKUS_LIBVIPS_LIBRARY=$lib" >> "$GITHUB_ENV"
          echo "LIBVIPS_EXPECT_AVIF=true" >> "$GITHUB_ENV"
          echo "LIBVIPS_EXPECT_GIF=true" >> "$GITHUB_ENV"

      - name: Build
        run: mvn -B -ntp -T 4 verify -DskipITs=false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            **/target/surefire-reports/*.dumpstream
            **/hs_err_pid*.log
          retention-days: 7

  # Runs on pull requests as well as master: native image is sensitive to how downcalls and run-time initialised
  # classes are registered, which is easy to get wrong and expensive to discover after merging.
  native:
    name: Native Image Test
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # the native executable opens libvips.so.42 at run time (dlopen), on the runner, not in the builder container
      - name: Install libvips
        run: |
          sudo apt-get update
          # Ubuntu 24.04 renamed the package for the 64-bit time_t transition; the AV1 plugin is for AVIF saving
          sudo apt-get install -y libvips42t64 libheif-plugin-aomenc || sudo apt-get install -y libvips42 libheif-plugin-aomenc
          lib="$(ldconfig -p | awk '/libvips\.so\.42 / { print $NF; exit }')"
          [ -n "$lib" ] || { echo "::error::libvips.so.42 not found after install"; exit 1; }
          dpkg -l | awk '/libvips42|libheif/ { print $2, $3 }'
          echo "QUARKUS_LIBVIPS_LIBRARY=$lib" >> "$GITHUB_ENV"
          echo "LIBVIPS_EXPECT_AVIF=true" >> "$GITHUB_ENV"
          echo "LIBVIPS_EXPECT_GIF=true" >> "$GITHUB_ENV"

      # the Actions bash shell runs with -o pipefail: tee keeps the build's exit status
      - name: Build and test native image
        run: >-
          mvn -B -ntp -pl integration-tests -am verify -Dnative
          -Dquarkus.native.container-build=true
          -Dquarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-25
          -Dquarkus.native.additional-build-args=-J-XX:TieredStopAtLevel=1,--parallelism=8
          2>&1 | tee native-build.log

      - name: Upload native build logs and test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-results
          path: |
            native-build.log
            integration-tests/target/*-native-image-source-jar/reports/
            integration-tests/target/quarkus.log
            **/target/surefire-reports/
            **/target/failsafe-reports/
            **/hs_err_pid*.log
          retention-days: 7
